[package]
name = "pureshot"
version = "0.1.0"
description = "A private screenshot utility for Windows and Linux"
authors = ["PureShot"]
edition = "2021"

[lib]
name = "pureshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
image = "0.25"
quircs = "=0.10.3"
ocrs = { version = "=0.13.1", default-features = false, features = ["onnx"] }
rten = { version = "=0.26.0", default-features = false, features = ["onnx_format"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Neural-network inference is prohibitively slow with unoptimized dev builds.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ashpd = { version = "=0.11.0", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(windows)'.dependencies]
capture-overlay = { path = "../vendor/capture-overlay" }
drag = "2.1.1"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
