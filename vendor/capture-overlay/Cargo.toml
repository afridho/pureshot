[package]
name = "capture-overlay"
publish = false
version = "0.1.1"
edition = "2021"
description = "A native Windows screenshot capture library with interactive overlay selection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stilltid/interactive-screenshot"
homepage = "https://github.com/stilltid/interactive-screenshot"
keywords = ["screenshot", "screen-capture", "win32", "windows", "gdi"]
categories = ["graphics", "os::windows-apis", "gui"]
authors = ["stilltid <160146445+stilltid@users.noreply.github.com>"]
rust-version = "1.75"

[dependencies]
log = "0.4"
thiserror = "2"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
